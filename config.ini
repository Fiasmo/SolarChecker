; Solar Guitars free-product checker settings.
; Lines starting with ; are comments.

[checker]
; Store pages to watch, one per line, indented (the price filter is in the URL).
pages =
    https://www.solar-guitars.com/shop/?min=0&max=1
    https://www.solar-guitars.com/black-sabbath/?min=0&max=1

; Also check the WooCommerce Store API. It covers every product, including
; accessories the pages above don't show. Recommended: yes
use_store_api = yes

; Whose prices to check. The store sets prices per country and otherwise guesses
; the country from the visitor's address; GitHub's servers are in the US, where
; the store shows many guitars at "US $0.00" by mistake. Two-letter country code.
country = GR
; The currency that country's prices are in. Store API answers in any other
; currency are ignored (they'd mean the country setting didn't work).
currency = EUR

; Alert when a product costs this much or less (in the currency above).
max_price = 0

; Seconds between checks.
interval_seconds = 60

; Open a free product's page in your browser as soon as it's found.
open_browser = yes

; Show a Windows desktop notification (click it to open the product).
desktop_notification = yes

; Keep the PC from going to sleep while the checker runs.
prevent_sleep = yes

; Email a warning if the site can't be reached this many checks in a row.
warn_after_failures = 10

[email]
enabled = yes

; This file is committed to GitHub, so DON'T put your address or password here.
; Put them in:
;   - on GitHub: repository secrets SOLAR_SMTP_USER, SOLAR_SMTP_PASSWORD
;     and (optional) SOLAR_EMAIL_TO
;   - on your PC: config.local.ini (git-ignored), same keys as below
;
; Gmail: smtp.gmail.com, port 587. smtp_password must be an App Password,
; not your normal password: https://myaccount.google.com/apppasswords
; (needs 2-Step Verification turned on). Any other SMTP server works too;
; port 465 uses SSL, anything else uses STARTTLS.
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user =
smtp_password =
; Sender; defaults to smtp_user.
email_from =
; Recipients, comma-separated; defaults to smtp_user.
email_to =

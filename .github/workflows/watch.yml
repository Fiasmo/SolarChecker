name: Watch for free products

# Each run checks every minute for ~5h40m (GitHub stops jobs at 6h).
# The hourly schedule keeps a next run queued behind the current one
# (see "concurrency"), so a new run starts as soon as the previous one ends.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: solar-checker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      # state.json remembers which products were already reported,
      # so you aren't emailed again for the same product by every run.
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: solar-state-${{ github.run_id }}
          restore-keys: solar-state-

      - name: Check every minute
        env:
          SOLAR_SMTP_USER: ${{ secrets.SOLAR_SMTP_USER }}
          SOLAR_SMTP_PASSWORD: ${{ secrets.SOLAR_SMTP_PASSWORD }}
          SOLAR_EMAIL_TO: ${{ secrets.SOLAR_EMAIL_TO }}
        run: python3 solar_checker.py --max-minutes 340

      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: solar-state-${{ github.run_id }}-${{ github.run_attempt }}
